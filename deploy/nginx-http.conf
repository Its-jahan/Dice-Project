# DICE over plain HTTP (no certificate).
#
# deploy/install.sh fills in the server names and drops the IPv6 listener on
# hosts that lack IPv6.
#
# Anything typed into this site — including a Dune API key — crosses the
# network in the clear. Use this only on a private network, or as the
# stepping stone certbot rewrites when you add a certificate.

server {
    listen 80 default_server;
    listen [::]:80 default_server;  # install.sh removes this on IPv4-only hosts
    server_name __SERVER_NAME__;

    include snippets/dice-proxy.conf;
}
