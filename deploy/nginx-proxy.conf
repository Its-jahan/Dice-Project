# Shared proxy body for the DICE vhosts.
# Installed by deploy/install.sh to /etc/nginx/snippets/dice-proxy.conf and
# included from both the HTTP and the HTTPS server blocks.

# Dune executions are slow; don't cut them off mid-poll.
proxy_read_timeout 900s;
proxy_send_timeout 900s;
client_max_body_size 1m;

# Exports of a large holder set can be tens of MB — stream them.
proxy_buffering off;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;

# Graphify code map, when one has been built (see install.sh --with-graph).
# Served from /opt/graph-site rather than the app directory on purpose:
# install.sh rsyncs --delete into $APP_DIR, so a graph kept there would be
# destroyed by the next deploy. Missing directory simply 404s.
location /graph/ {
    alias /opt/graph-site/;
    index graph.html;
    autoindex on;
    add_header Cache-Control "no-store";
}

location / {
    # Uncomment these two lines (after the htpasswd step in deploy/README.md)
    # to put the whole app behind a password.
    # auth_basic "DICE";
    # auth_basic_user_file /etc/nginx/dice.htpasswd;

    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
