# Shared proxy body for the DICE vhosts.
# Installed by deploy/install.sh to /etc/nginx/snippets/dice-proxy.conf and
# included from both the HTTP and the HTTPS server blocks.

# Dune executions are slow; don't cut them off mid-poll.
proxy_read_timeout 900s;
proxy_send_timeout 900s;
client_max_body_size 1m;

# Exports of a large holder set can be tens of MB — stream them.
proxy_buffering off;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;

# The app authenticates itself — see backend/app/auth.py: a sign-in page, a
# revocable session and a lockout, none of which Basic Auth can offer. So
# there is deliberately no password gate at server level any more; stacking
# one would only put a second, uglier prompt in front of the first.
#
# It survives in exactly one place, /graph/ below, and that is not an
# oversight. Read the comment there before removing it.
auth_basic off;

# Graphify code map, when one has been built (see install.sh --with-graph).
# Served from /opt/graph-site rather than the app directory on purpose:
# install.sh rsyncs --delete into $APP_DIR, so a graph kept there would be
# destroyed by the next deploy. Missing directory simply 404s.
location /graph/ {
    # This alias is served off disk by nginx: the request never reaches the
    # app, so the app's session gate cannot protect it. Without a password
    # here a full map of the codebase is public to anyone who guesses the
    # path. install.sh re-arms these whenever the htpasswd file exists.
    # auth_basic "DICE code map";
    # auth_basic_user_file /etc/nginx/dice.htpasswd;
    alias /opt/graph-site/;
    index graph.html;
    autoindex on;
    add_header Cache-Control "no-store";
}

# The webhook endpoints must stay reachable without a password: they are called
# by Alchemy, which cannot present one. Exposing them is safe by design — every
# delivery is rejected unless it carries a signature computed with the
# webhook's own signing key, and an unknown webhook id never reaches the store.
# This block must precede `location /` or the password would apply here too and
# every signal would silently stop arriving.
location = /api/webhooks/alchemy {
    auth_basic off;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
