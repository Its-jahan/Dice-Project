# DICE over HTTPS.
#
# deploy/install.sh fills in the certificate paths, pointing either at a
# Let's Encrypt certificate it found under /etc/letsencrypt/live/, or at the
# self-signed pair it generated in /etc/dice/tls/.
#
# A self-signed certificate encrypts the connection — so a Dune API key is not
# readable by anyone passively watching the network — but browsers warn,
# because it proves no identity. See deploy/README.md for the sslip.io route
# to a real publicly-trusted certificate without owning a domain.

server {
    listen 80 default_server;
    listen [::]:80 default_server;  # install.sh removes this on IPv4-only hosts
    server_name __SERVER_NAME__;

    # Keep the ACME path on cleartext so certificate renewal keeps working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else: never serve the app over cleartext once TLS exists.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;  # install.sh removes this on IPv4-only hosts
    __HTTP2__
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:DICE:10m;
    ssl_session_timeout 1d;

    include snippets/dice-proxy.conf;
}
