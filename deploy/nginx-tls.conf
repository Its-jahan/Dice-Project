# DICE over HTTPS with a self-signed certificate.
#
# Used when the server is reached by bare IP and no CA will issue a
# certificate for it. The connection is encrypted, so a Dune API key is no
# longer readable by anyone passively watching the network — but because the
# certificate is not signed by a public CA, browsers show a warning and an
# active attacker who can redirect your traffic could substitute their own
# certificate. See deploy/README.md for the sslip.io route, which gets you a
# real publicly-trusted certificate without owning a domain.

server {
    listen 80 default_server;
    listen [::]:80 default_server;  # install.sh removes this on IPv4-only hosts
    server_name __SERVER_NAME__;

    # Never serve the app over cleartext once TLS exists.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;  # install.sh removes this on IPv4-only hosts
    __HTTP2__
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/dice/tls/dice.crt;
    ssl_certificate_key /etc/dice/tls/dice.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:DICE:10m;
    ssl_session_timeout 1d;

    include snippets/dice-proxy.conf;
}
