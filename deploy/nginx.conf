# DICE reverse proxy.
#
# The SERVER_NAME placeholder below is filled in by deploy/install.sh with the
# domain (or IP) this site answers on.
#
# TLS is added afterwards by `certbot --nginx`, which rewrites this file.
# Until then the site is plain HTTP — do not enter a Dune API key over it.

server {
    listen 80;
    listen [::]:80;  # install.sh removes this line on hosts without IPv6
    server_name __SERVER_NAME__;

    # Dune executions are slow; don't cut them off mid-poll.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_max_body_size 1m;

    # Exports of a large holder set can be tens of MB.
    proxy_buffering off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        # Uncomment these two lines (and run the htpasswd step in install.sh)
        # to put the whole app behind a password.
        # auth_basic "DICE";
        # auth_basic_user_file /etc/nginx/dice.htpasswd;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
