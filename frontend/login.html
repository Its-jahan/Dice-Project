<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — DICE</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bdb'/%3E%3Cpath d='M16 6l10 10-10 10L6 16z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    // Match the app: follow the OS theme, no toggle, no flash of the wrong one.
    document.documentElement.setAttribute(
      "data-bs-theme",
      window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
    );
  </script>
  <style>
    /* The card is the only thing on the page, so it gets to be centred
       properly rather than pushed down from the top. */
    .signin-shell {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .signin-card { width: 100%; max-width: 25rem; }
    /* The mark, larger than in the navbar — this is the one screen where the
       app introduces itself rather than getting out of the way. */
    .signin-mark {
      width: 3rem; height: 3rem; border-radius: 0.85rem;
      background: #3b5bdb; color: #fff;
      display: grid; place-items: center;
      font-size: 1.6rem; line-height: 1;
    }
  </style>
</head>
<body class="bg-body-tertiary">

  <main class="signin-shell">
    <div class="signin-card">

      <div class="d-flex align-items-center gap-3 mb-4">
        <span class="signin-mark" aria-hidden="true">&#9672;</span>
        <div>
          <h1 class="h4 mb-0">DICE</h1>
          <p class="text-body-secondary small mb-0">
            Historical token holders &amp; wallet buy signals
          </p>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <!-- A real form POST, deliberately. This is the one page that must
               never fail, and a login that needs JavaScript to work is a login
               that can lock you out of your own server. -->
          <form method="post" action="/login" autocomplete="on">
            <input type="hidden" name="next" value="__NEXT__">

            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <input id="password" name="password" type="password"
                     class="form-control" required autofocus
                     autocomplete="current-password"
                     aria-describedby="signinHelp">
              <button type="button" id="reveal" class="btn btn-outline-secondary"
                      aria-label="Show password" hidden>Show</button>
            </div>

            <div class="form-check mt-3">
              <input class="form-check-input" type="checkbox"
                     id="remember" name="remember" value="1">
              <label class="form-check-label small" for="remember">
                Keep me signed in on this browser for 30 days
              </label>
            </div>

            __ERROR__

            <button type="submit" class="btn btn-primary w-100 mt-3">
              Sign in
            </button>
          </form>

        </div>
      </div>

      <!-- Says what the door is for. This server can spend money, which is a
           better reason to care about the password than "it is private". -->
      <p id="signinHelp" class="form-text mt-3 mb-0">
        This server stores your Dune, model and Alchemy keys, and can spend
        them. After __MAX_ATTEMPTS__ wrong answers it stops accepting
        attempts from your address for __LOCKOUT__ minutes.
      </p>

    </div>
  </main>

  <script>
    // Progressive enhancement only: the form above works without any of this.
    const field = document.getElementById("password");
    const reveal = document.getElementById("reveal");
    reveal.hidden = false;
    reveal.addEventListener("click", () => {
      const hidden = field.type === "password";
      field.type = hidden ? "text" : "password";
      reveal.textContent = hidden ? "Hide" : "Show";
      reveal.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
      field.focus();
    });
  </script>

</body>
</html>
